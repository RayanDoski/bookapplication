# fly.toml app configuration file
#
# This file is now configured to use your custom Dockerfile
# and run the application on the correct port.
#

app = 'bookapplication-backend'
primary_region = 'arn'

[env]
  PORT = '5001'

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']